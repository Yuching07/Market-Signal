<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>市場情報雷達 Market Signal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar with three views; dashboard = signal cards (main) + priority matrix & watch list (aside); detail = indicators + event timeline */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#13212B; --ink-2:#44535F; --muted:#6C7A86;
  --line:#DCE2E7; --line-2:#C5CED6;
  --accent:#0C6774; --accent-ink:#FFFFFF; --accent-soft:#DFEEF0;
  --st-new:#2A63C4; --st-dev:#6C42BD; --st-per:#1B7A4B; --st-weak:#B0570F;
  --warn:#B0261D; --warn-soft:#FBEAE7;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-display:"Noto Serif TC","PMingLiU","Songti TC",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --surface:#141E26; --surface-2:#1A2630; --ink:#E4EBF0; --ink-2:#A9B6C0; --muted:#7E8C97;
  --line:#25333E; --line-2:#344451;
  --accent:#4DB3C1; --accent-ink:#06191C; --accent-soft:#12323A;
  --st-new:#6E9FF2; --st-dev:#A98CEB; --st-per:#4CC287; --st-weak:#E89B52;
  --warn:#F0857B; --warn-soft:#3A1C1A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D141A; --surface:#141E26; --surface-2:#1A2630; --ink:#E4EBF0; --ink-2:#A9B6C0; --muted:#7E8C97;
  --line:#25333E; --line-2:#344451;
  --accent:#4DB3C1; --accent-ink:#06191C; --accent-soft:#12323A;
  --st-new:#6E9FF2; --st-dev:#A98CEB; --st-per:#4CC287; --st-weak:#E89B52;
  --warn:#F0857B; --warn-soft:#3A1C1A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
table{font-size:inherit;border-collapse:collapse}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-name{font-weight:700;font-size:17px;letter-spacing:.02em}
.brand-sub{font-family:var(--f-num);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.basedate{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.basedate b{color:var(--ink);font-weight:500}
.mode-tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500;align-self:center}
.mode-tag:empty{display:none}
.muted{color:var(--muted)}
.mode-note{font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.src-status{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.src-status li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.src-status li:first-child{border-top:0;padding-top:0}
.src-status .ok{color:var(--st-per);font-weight:500}
.src-status .fail{color:var(--warn);font-weight:500}

main{padding-block:24px 64px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:20px}
.view-head h1{font-family:var(--f-display);font-size:26px;font-weight:700}
.view-head p{color:var(--ink-2);max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:500}

/* change summary */
.changes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:20px}
.changes-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:10px}
.changes-head h2{font-size:15px}
.changes-head span{font-size:13px;color:var(--muted)}
.change-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 20px}
.change-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;min-width:0}
.change-ico{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;margin-top:1px;background:var(--surface-2);color:var(--ink-2)}
.change-ico.c-new{background:color-mix(in srgb,var(--st-new) 16%,transparent);color:var(--st-new)}
.change-ico.c-status{background:color-mix(in srgb,var(--st-dev) 16%,transparent);color:var(--st-dev)}
.change-ico.c-warn{background:var(--warn-soft);color:var(--warn)}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip .n{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.sort{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin-left:auto}
.sort select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 8px}

.dash{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
@media (max-width:1000px){.dash{grid-template-columns:minmax(0,1fr)}}
.cards{display:grid;gap:12px}

/* signal card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--line-2);box-shadow:0 2px 10px color-mix(in srgb,var(--ink) 8%,transparent)}
.card:focus-within{border-color:var(--accent)}
.card-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.cats{font-size:12.5px;color:var(--muted)}
.card h3{font-size:17px;font-weight:700}
.card-link{all:unset;cursor:pointer}
.card-link::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.card-link:focus-visible{outline:none}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.metrics{grid-template-columns:1fr 1fr}.metrics .m:last-child{grid-column:1/-1}}
.m{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.m-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.m-val{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.3}
.m-val.na{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:500;line-height:2}
.card-foot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2)}
.card-foot .warnflag{color:var(--warn);font-weight:500}
.action{font-weight:500}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.pill .g{font-size:10px}
.st-new{color:var(--st-new);background:color-mix(in srgb,var(--st-new) 10%,transparent)}
.st-dev{color:var(--st-dev);background:color-mix(in srgb,var(--st-dev) 10%,transparent)}
.st-per{color:var(--st-per);background:color-mix(in srgb,var(--st-per) 10%,transparent)}
.st-weak{color:var(--st-weak);background:color-mix(in srgb,var(--st-weak) 10%,transparent)}
.tag{font-size:11px;padding:0 6px;border-radius:4px;font-weight:500;letter-spacing:.04em;white-space:nowrap;line-height:1.7}
.tag.formal{background:var(--accent-soft);color:var(--accent)}
.tag.prov{border:1px dashed var(--line-2);color:var(--ink-2)}
.tag.none{color:var(--muted)}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* aside panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:15px;margin-bottom:4px}
.panel .sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.chart-wrap text{font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:8px;line-height:1.5;max-width:220px;transform:translate(-50%,calc(-100% - 12px));white-space:normal;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.hollow{background:var(--surface)!important;border:2px solid var(--ink-2)}
.watch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.watch li{border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
.watch li:first-child{border-top:0;padding-top:0}
.watch .w-title{font-weight:500}
.watch .w-meta{font-size:12px;color:var(--muted)}
.watch .w-why{color:var(--ink-2);font-size:13px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r)}

/* detail */
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500;margin-bottom:14px}
.d-head{display:grid;gap:10px;margin-bottom:20px}
.d-head h1{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);font-weight:700;max-width:36ch}
.d-path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.d-summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:none}
.d-summary p{max-width:72ch;color:var(--ink)}
.d-summary .eyebrow{margin-bottom:6px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;margin-top:20px}
@media (max-width:1000px){.detail{grid-template-columns:minmax(0,1fr)}}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.groups{grid-template-columns:1fr}}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:14px;align-content:start}
.group-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.group-head h2{font-size:15px}
.group-head .en{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.group-score{text-align:right}
.group-score .num{font-size:28px;font-weight:600;line-height:1.1}
.ind{display:grid;gap:6px}
.ind-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ind-name{font-weight:500;font-size:14px}
.ind-name small{color:var(--muted);font-family:var(--f-num);font-size:11px;margin-left:4px}
.ind-score{font-family:var(--f-num);font-weight:600}
.ind-score.na{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.segs i{height:6px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--accent)}
.segs.na i{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.ind-why{font-size:13.5px;color:var(--ink-2)}
.ind-rule{font-size:11.5px;color:var(--muted)}

.section-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:28px 0 12px}
.section-title h2{font-size:18px}
.section-title span{font-size:13px;color:var(--muted)}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:24px;position:relative;padding-bottom:18px}
.tl::before{content:"";position:absolute;left:91px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl.d-support::before{border-color:var(--st-per);background:var(--st-per)}
.tl.d-counter::before{border-color:var(--st-weak);background:var(--st-weak)}
.tl.d-context::before{border-color:var(--muted)}
.tl.d-hold::before{border-color:var(--warn);border-style:dashed}
.tl-date{font-family:var(--f-num);font-size:13px;text-align:right;color:var(--ink-2);padding-top:1px}
.tl-date.unk{font-family:var(--f-body);color:var(--warn)}
.tl-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0}
.tl-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kind{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:0 6px;border:1px solid var(--line)}
.dir{font-size:12px;font-weight:500;padding:0 6px;border-radius:4px}
.dir.support{color:var(--st-per);background:color-mix(in srgb,var(--st-per) 12%,transparent)}
.dir.counter{color:var(--st-weak);background:color-mix(in srgb,var(--st-weak) 12%,transparent)}
.dir.context{color:var(--ink-2);background:var(--surface-2)}
.dir.hold{color:var(--warn);background:var(--warn-soft)}
.tl-sum{font-weight:500}
.tl-note{font-size:13.5px;color:var(--ink-2)}
.docs{list-style:none;margin:0;padding:0;display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.docs li{font-size:13px;color:var(--ink-2);display:grid;gap:2px}
.docs .src{font-weight:500;color:var(--ink)}
.docs .no{font-family:var(--f-num);color:var(--muted)}
.flag{font-size:12px;color:var(--muted)}
.flag.dup::before{content:"⧉ "}
.flag.late::before{content:"↺ "}
.statusmark{display:flex;gap:8px;align-items:flex-start;font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px;display:grid;gap:4px}
.warnbox b{color:var(--warn)}
.warnbox ul{margin:0;padding-left:18px}
@media (max-width:560px){
  .timeline::before{left:7px}
  .tl{grid-template-columns:minmax(0,1fr);gap:6px;padding-left:26px}
  .tl::before{left:2px}
  .tl-date{text-align:left}
}
.aside-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.dots{display:flex;gap:6px;margin:6px 0}
.dots span{flex:1;font-size:11px;text-align:center;padding:4px 0;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.dots span.na{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

/* data table */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;min-width:0;width:min(360px,100%)}
.table-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dt{width:100%;min-width:980px}
.dt th,.dt td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:13.5px}
.dt th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
.dt tr:last-child td{border-bottom:0}
.dt td.num{white-space:nowrap}
.dt .t{min-width:260px;color:var(--ink)}
.dt .warncell{color:var(--warn);font-weight:500}
.dt .muted{color:var(--muted)}

/* method */
.method{display:grid;gap:20px;max-width:980px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:12px}
.block h2{font-size:17px}
.block p{max-width:72ch;color:var(--ink-2)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px;display:grid;gap:2px;min-width:0}
.steps li::before{content:counter(s);font-family:var(--f-num);font-size:12px;color:var(--accent);font-weight:600}
.steps b{font-weight:700}
.steps span{color:var(--ink-2);font-size:12.5px}
.formula{font-family:var(--f-num);background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:14px;overflow-x:auto}
.kv{width:100%}
.kv th,.kv td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
.kv th{color:var(--muted);font-weight:500;font-size:12px}
.kv tr:last-child td{border-bottom:0}
details.kw{border-top:1px solid var(--line);padding-top:8px}
details.kw summary{cursor:pointer;font-weight:500;padding:2px 0}
.kwrow{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.kwrow b{font-size:12px;color:var(--muted);font-weight:500;width:100%}
.kwi{font-size:12.5px;padding:1px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.kwi.p{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.classify textarea{width:100%;min-height:76px;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--surface);resize:vertical}
.cls-out{display:grid;gap:8px}
.cls-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.cls-row .res{font-weight:700;margin-right:6px}
.cls-row.cand .res{color:var(--ink-2);font-weight:500}
/* 手機版：放大字級、精簡頂列、表格改為卡片 */
@media (max-width:600px){
  body{font-size:16px}
  .topbar .wrap{gap:6px 12px;padding-block:8px}
  .brand-name{font-size:16px}
  .tabs{order:3;width:100%}
  .tab{flex:1;padding:8px 4px;font-size:15px}
  .basedate{font-size:13px}
  main{padding-block:18px 48px}
  .view-head h1{font-size:23px}
  .view-head p{font-size:15.5px}

/* ===================== 計算 ===================== */
const utc = d=>{const [y,m,dd]=d.split('-').map(Number);return Date.UTC(y,m-1,dd)};
const days = (a,b)=>Math.round((utc(b)-utc(a))/864e5);
const fmt = d=>d?d.replaceAll('-','/'):'日期待確認';
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2 = v=>v==null?'—':v.toFixed(2);

const RECENCY = [[14,5],[45,4],[90,3],[180,2],[Infinity,1]];
const recencyScore = d=>RECENCY.find(([max])=>d<=max)[1];

function composite(vals){
  const v=vals.filter(x=>x!=null);
  if(!v.length) return {score:null, kind:'none', n:0, of:vals.length};
  return {score:v.reduce((a,b)=>a+b,0)/v.length, kind:v.length===vals.length?'formal':'prov', n:v.length, of:vals.length};
}
function statusAt(s,date){let st=null;for(const h of s.history){if(h.date<=date)st=h.st}return st}

function loadData(d){
  META=d.meta; BASE=d.meta.base; PREV=d.meta.prev||null;
  CATS=d.categories; CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
  SRC=d.sources; DOCS=d.docs; EVENTS=d.events; SIGNALS=d.signals; WATCH=d.watch; THEMES=d.themes||[];
}
let THEMES=[];

// 由原始資料推導事件日期與類型，並計算各訊號的時效性、綜合分數與完整度
function prepare(){
  const byEv={};
  for(const d of DOCS) (byEv[d.ev]=byEv[d.ev]||[]).push(d);
  for (const [id,e] of Object.entries(EVENTS)){
    e.id=id; e.docs=byEv[id]||[];
    const ds=e.docs.map(d=>d.date).filter(Boolean).sort();
    e.date=ds[0]||null;
    e.kind=e.docs.find(d=>!d.dupOf)?.kind||e.docs[0]?.kind||'news';
  }
  WATCH=WATCH.filter(w=>EVENTS[w.ev]?.docs.length);
  SIGNALS=SIGNALS.filter(s=>s.evidence.some(e=>EVENTS[e.ev]?.docs.length));
  for(const s of SIGNALS){
  s.evidence=s.evidence.filter(e=>EVENTS[e.ev]);
  for(const h of s.history) h.date=h.date||EVENTS[h.ev]?.date;
  s.history=s.history.filter(h=>h.date);
  const valid=s.evidence.filter(e=>e.dir==='support'||e.dir==='counter');
  const latest=valid.map(e=>EVENTS[e.ev].date).filter(Boolean).sort().at(-1)||BASE;
  const rd=days(latest,BASE);
  s.r={v:recencyScore(rd), why:`最新有效事件發布於 ${fmt(latest)}，距資料基準日 ${rd} 天。依事件發布日期計算，不以收錄日期計算。`};
  s.cred=composite([s.es.v,s.c.v]);
  s.sig=composite([s.r.v,s.m.v,s.i.v]);
  const all=[s.es.v,s.c.v,s.r.v,s.m.v,s.i.v];
  s.nValid=all.filter(x=>x!=null).length;
  s.complete=s.nValid/5*100;
  s.status=s.history.at(-1)?.st||'new';
  s.latest=latest;
  s.nIndep=valid.length;
  s.warnings=s.evidence.filter(e=>EVENTS[e.ev].docs.some(d=>d.warn)).length;
  const c=s.cred.score??0, g=s.sig.score??0;
  s.action = c>=3.75&&g>=3.75?'優先關注': g>=3.75?'持續追蹤': c>=3.75?'定期檢視':'補充調查';
  }
}

const app=document.getElementById('app');
const MODE_LABEL={ai:'AI 語意分析', rules:'規則分析', demo:'示範資料'};

async function boot(){
  try{
    const r=await fetch('data/signals.json',{cache:'no-store'});
    if(r.ok){const d=await r.json(); if(d.meta&&d.signals) loadData(d)}
  }catch(e){/* 無法讀取時使用示範資料 */}
  prepare();
  try{const saved=JSON.parse(localStorage.getItem('ms-prefs')||'{}');if(saved.cat&&(saved.cat==='all'||saved.cat==='general'||CAT[saved.cat]))state.cat=saved.cat;if(saved.sort)state.sort=saved.sort}catch(e){}
  document.getElementById('baseDate').textContent=fmt(BASE);
  document.getElementById('modeTag').textContent=MODE_LABEL[META.mode]||'';
  render();
}

const pill = st=>`<span class="pill ${STATUS[st].cls}"><span class="g" aria-hidden="true">${STATUS[st].g}</span>${STATUS[st].label}</span>`;
const kindTag = k=>({formal:'<span class="tag formal">正式</span>',prov:'<span class="tag prov">暫定</span>',none:'<span class="tag none">無法評估</span>'})[k];
const catNames = ids=>ids.length?ids.map(id=>CAT[id].name).join(' · '):'整體市場議題';
// 「整體市場議題」篩選：不屬於單一商品類別的產業議題訊號
const inCatFilter = (cats,cat)=>cat==='all'||(cat==='general'?!cats.length:cats.includes(cat));
const segs = v=>v==null?`<div class="segs na" aria-hidden="true">${'<i></i>'.repeat(5)}</div>`:`<div class="segs" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=v?'on':''}"></i>`).join('')}</div>`;

function metric(label,comp){
  return `<div class="m"><div class="m-label"><span>${label}</span>${kindTag(comp.kind)}</div>
    ${comp.score==null?'<div class="m-val na">資料不足</div>':`<div class="m-val">${f2(comp.score)}</div>`}
    <div class="note">${comp.n}/${comp.of} 項有效</div></div>`;
}
function card(s){
  return `<article class="card">
    <div class="card-top">${pill(s.status)}<span class="cats">${catNames(s.cats)}</span></div>
    <h3><button class="card-link" data-open="${s.id}">${esc(s.name)}</button></h3>
    <div class="metrics">
      ${metric('可信度',s.cred)}
      ${metric('重大性',s.sig)}
      <div class="m"><div class="m-label"><span>資料完整度</span></div><div class="m-val">${s.complete}%</div><div class="bar"><i style="width:${s.complete}%"></i></div></div>
    </div>
    <div class="card-foot">
      <span>最新事件 <span class="num">${fmt(s.latest)}</span></span>
      <span>獨立事件 <span class="num">${s.nIndep}</span></span>
      <span class="action">建議：${s.action}</span>
      ${s.warnings?`<span class="warnflag">⚠ 資料品質警示 ${s.warnings}</span>`:''}
    </div>
  </article>`;
}

/* ===================== 儀表板 ===================== */
function changes(){
  if(!PREV) return `<section class="changes" aria-labelledby="chg">
    <div class="changes-head"><h2 id="chg">近期市場變化摘要</h2><span>首次建立資料（${fmt(BASE)}）</span></div>
    <ul class="change-list"><li><span class="change-ico c-new" aria-hidden="true">＋</span><span>收錄 ${DOCS.length} 筆相關資料，去重後 ${Object.keys(EVENTS).length} 項事件，形成 ${SIGNALS.length} 個市場訊號。下次更新起會列出與前次的差異。</span></li></ul>
  </section>`;
  const items=[];
  for(const s of SIGNALS){
    const p=statusAt(s,PREV);
    if(!p) items.push({cls:'c-new',ico:'＋',html:`新增訊號：<button class="linkish" data-open="${s.id}">${esc(s.short)}</button>（${STATUS[s.status].label}）`});
    else if(p!==s.status) items.push({cls:'c-status',ico:'↗',html:`<button class="linkish" data-open="${s.id}">${esc(s.short)}</button>：${STATUS[p].label} → ${STATUS[s.status].label}`});
  }
  const back=DOCS.filter(d=>d.date&&d.ingest>PREV&&d.date<PREV&&days(d.date,d.ingest)>14);
  if(back.length) items.push({cls:'',ico:'↺',html:`補收錄 ${back.length} 筆歷史資料（${back.slice(0,8).map(d=>'#'+d.no).join('、')}${back.length>8?' 等':''}），已依發布日期排回時間軸，未視為最新事件`});
  const dups=DOCS.filter(d=>d.dupOf&&d.ingest>PREV);
  if(dups.length) items.push({cls:'',ico:'⧉',html:`合併 ${dups.length} 筆重複報導（${dups.slice(0,6).map(d=>`#${d.no}→#${d.dupOf}`).join('、')}${dups.length>6?' 等':''}），不重複計入證據`});
  const w=DOCS.filter(d=>d.warn&&d.ingest>PREV);
  if(w.length) items.push({cls:'c-warn',ico:'!',html:`新增 ${w.length} 筆原始資料品質警示（${w.slice(0,8).map(d=>'#'+d.no).join('、')}${w.length>8?' 等':''}），確認前不計入證據`});
  const fresh=DOCS.filter(d=>d.ingest>PREV&&!d.dupOf).length;
  if(META.mode!=='demo') items.push({cls:'',ico:'↧',html:`本次新收錄 ${DOCS.filter(d=>d.ingest>PREV).length} 筆資料，其中 ${fresh} 筆為新的獨立事件`});
  if(!items.length) items.push({cls:'',ico:'＝',html:'與上次更新相比，訊號狀態沒有變化'});
  return `<section class="changes" aria-labelledby="chg">
    <div class="changes-head"><h2 id="chg">近期市場變化摘要</h2><span>本次更新 ${fmt(BASE)}，與上次更新 ${fmt(PREV)} 比較</span></div>
    <ul class="change-list">${items.map(i=>`<li><span class="change-ico ${i.cls}" aria-hidden="true">${i.ico}</span><span>${i.html}</span></li>`).join('')}</ul>
  </section>`;
}

function matrix(list){
  const narrow=window.innerWidth<600;
  const W=narrow?360:560,H=narrow?300:340,L=narrow?40:46,R=narrow?10:18,T=14,B=46;
  const k=narrow?1.15:1;
  const pts=SIGNALS.filter(s=>s.cred.score!=null&&s.sig.score!=null);
  // 座標範圍依資料調整，最低不超過 1 分
  const lo=(vals,def)=>Math.max(1,Math.min(def,Math.floor((Math.min(...vals)-0.25)*2)/2));
  const xd=[lo(pts.map(s=>s.cred.score),2.5),5.25], yd=[lo(pts.map(s=>s.sig.score),3),5];
  const x=v=>L+(v-xd[0])/(xd[1]-xd[0])*(W-L-R);
  const y=v=>T+(1-(v-yd[0])/(yd[1]-yd[0]))*(H-T-B);
  const ids=new Set(list.map(s=>s.id));
  let g='';
  const ticks=(d)=>{const t=[];for(let v=Math.ceil(d[0]*2)/2;v<=5;v+=0.5)t.push(v);return t};
  for(const t of ticks(xd)){
    g+=`<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width="1"/>`;
    g+=`<text x="${x(t)}" y="${H-B+16}" text-anchor="middle" font-size="${11*k}" fill="var(--muted)" class="num">${t.toFixed(1)}</text>`;
  }
  for(const t of ticks(yd)){
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>`;
    g+=`<text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="${11*k}" fill="var(--muted)">${t.toFixed(1)}</text>`;
  }
  g+=`<line x1="${x(3.75)}" x2="${x(3.75)}" y1="${T}" y2="${H-B}" stroke="var(--line-2)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(3.75)}" y2="${y(3.75)}" stroke="var(--line-2)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  const ql=(tx,ty,anchor,txt)=>`<text x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="${12*k}" font-weight="500" fill="var(--muted)">${txt}</text>`;
  g+=ql(W-R-6,T+16,'end','優先關注')+ql(L+6,T+16,'start','持續追蹤')+ql(W-R-6,H-B-8,'end','定期檢視')+ql(L+6,H-B-8,'start','補充調查');
  g+=`<text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" font-size="${12*k}" fill="var(--ink-2)">可信度 Credibility →</text>`;
  g+=`<text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="${12*k}" fill="var(--ink-2)">重大性 Significance →</text>`;
  // 相同座標的點左右錯開，避免完全重疊
  const groups={};
  for(const s of pts)(groups[f2(s.cred.score)+'|'+f2(s.sig.score)]=groups[f2(s.cred.score)+'|'+f2(s.sig.score)]||[]).push(s);
  const pos=new Map();
  for(const grp of Object.values(groups)) grp.forEach((s,i)=>pos.set(s,{cx:x(s.cred.score)+(i-(grp.length-1)/2)*10,cy:y(s.sig.score)}));
  // 標籤依重大性由高到低放置；右側、左側、上方都會重疊時省略（滑過資料點仍可看到名稱）
  const fs=12.5*k, placed=[];
  const fits=r=>r.x>=L&&r.x+r.w<=W-R&&r.y>=T&&r.y+r.h<=H-B&&!placed.some(p=>r.x<p.x+p.w&&p.x<r.x+r.w&&r.y<p.y+p.h&&p.y<r.y+r.h);
  const labels=new Map();
  for(const s of [...pts].filter(s=>ids.has(s.id)).sort((a,b)=>b.sig.score-a.sig.score)){
    const {cx,cy}=pos.get(s), w=s.short.length*fs+4, h=fs+2;
    const opts=[{x:cx+11,y:cy-h/2,a:'start',tx:cx+12},{x:cx-11-w,y:cy-h/2,a:'end',tx:cx-12},{x:cx-w/2,y:cy-10-h,a:'middle',tx:cx,ty:cy-12}];
    const o=opts.find(o=>fits({x:o.x,y:o.y,w,h}));
    if(o){placed.push({x:o.x,y:o.y,w,h});labels.set(s,o)}
  }
  for(const s of pts){
    const {cx,cy}=pos.get(s), on=ids.has(s.id), lab=labels.get(s);
    const prov=s.cred.kind!=='formal'||s.sig.kind!=='formal';
    const col=STATUS[s.status].color;
    g+=`<g class="pt" data-id="${s.id}" tabindex="0" role="button" aria-label="${esc(s.short)}：可信度 ${f2(s.cred.score)}，重大性 ${f2(s.sig.score)}，${STATUS[s.status].label}" style="cursor:pointer;opacity:${on?1:.22}">
      <circle cx="${cx}" cy="${cy}" r="16" fill="transparent"/>
      <circle cx="${cx}" cy="${cy}" r="7" fill="${prov?'var(--surface)':col}" stroke="${prov?col:'var(--surface)'}" stroke-width="${prov?2.5:2}"/>
      ${lab?`<text x="${lab.tx}" y="${lab.ty??cy+4}" text-anchor="${lab.a}" font-size="${fs}" font-weight="500" fill="var(--ink)">${esc(s.short)}</text>`:''}
    </g>`;
  }
  return `<div class="chart-wrap" id="mx"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="市場訊號優先順序矩陣">${g}</svg><div class="tip" hidden></div></div>
  <div class="legend">${Object.values(STATUS).map(st=>`<span><i style="background:${st.color}"></i>${st.label}</span>`).join('')}<span><i class="hollow"></i>含暫定分數</span></div>`;
}

function bindMatrix(){
  const wrap=document.getElementById('mx'); if(!wrap) return;
  const tip=wrap.querySelector('.tip');
  const show=el=>{
    const s=SIGNALS.find(x=>x.id===el.dataset.id);
    const c=el.querySelectorAll('circle')[1].getBoundingClientRect(), w=wrap.getBoundingClientRect();
    tip.innerHTML=`<b>${esc(s.short)}</b>　${STATUS[s.status].label}<br>可信度 ${f2(s.cred.score)}（${s.cred.kind==='formal'?'正式':'暫定'}）<br>重大性 ${f2(s.sig.score)}（${s.sig.kind==='formal'?'正式':'暫定'}）<br>資料完整度 ${s.complete}%`;
    tip.hidden=false;
    const left=Math.min(Math.max(c.left-w.left+c.width/2,110),w.width-110);
    tip.style.left=left+'px'; tip.style.top=(c.top-w.top)+'px';
  };
  wrap.querySelectorAll('.pt').forEach(el=>{
    el.addEventListener('pointerenter',()=>show(el));
    el.addEventListener('focus',()=>show(el));
    el.addEventListener('pointerleave',()=>tip.hidden=true);
    el.addEventListener('blur',()=>tip.hidden=true);
    el.addEventListener('click',()=>go('detail',el.dataset.id));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('detail',el.dataset.id)}});
  });
}

function linkedSignals(evId){
  const out=[];
  for(const s of SIGNALS){const e=s.evidence.find(x=>x.ev===evId);if(e)out.push(`<button class="linkish" data-open="${s.id}">${esc(s.short)}</button><span class="muted">（${DIR[e.dir].replace(/（.*）/,'')}）</span>`);
    if(s.related?.some(r=>r.ev===evId))out.push(`<span class="muted">${esc(s.short)}（相關未計入）</span>`)}
  if(!out.length&&WATCH.some(w=>w.ev===evId))out.push('<span class="muted">觀察中</span>');
  return out.join('<br>')||'<span class="muted">—</span>';
}

      const dd=d.dupOf?`重複 → 併入 #${d.dupOf}`:E.docs.length>1?`獨立事件（含 ${E.docs.length} 筆）`:'獨立事件';
      const td=(label,html,cls='')=>`<td class="${cls}" data-label="${label}"><div>${html}</div></td>`;
      return `<tr>${td('編號',d.no,'num')}${td('發布日期',d.date?fmt(d.date):`<span class="warncell">待確認</span><br><span class="muted">標示 ${fmt(d.labeled)}</span>`,'num')}
      ${td('收錄日期',fmt(d.ingest)+(late?'<br><span class="muted">補收錄</span>':''),'num')}
      ${td('來源',`<a href="${SRC[d.src].url}" target="_blank" rel="noopener">${SRC[d.src].name}</a>${d.origin?`<br><span class="muted">原載：${esc(d.origin)}</span>`:''}`)}${td('類型',KIND[d.kind])}
      ${td('資料名稱',d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a>`:esc(d.title),'t')}${td('去重結果',dd)}${td('關聯訊號',linkedSignals(d.ev))}
      ${td('品質',d.warn?`<span class="warncell">⚠ ${d.warn.length} 項異常</span>`:'<span class="muted">—</span>')}</tr>`}).join('')}
    ${rows.length?'':'<tr><td colspan="9" class="muted emptycell">沒有符合的資料，請換個關鍵字。</td></tr>'}</tbody>
  </table></div>`;
  const qi=document.getElementById('q');
  qi.oninput=e=>{state.q=e.target.value;const pos=e.target.selectionStart;renderData();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
}

/* ===================== 評估方法 ===================== */
function classify(text){
  return CATS.map(c=>({c, p:[...c.p,...(c.a||[])].filter(k=>text.includes(k)), s:c.s.filter(k=>text.includes(k))})).filter(r=>r.p.length||r.s.length)
    .sort((a,b)=>(b.p.length-a.p.length)||(b.s.length-a.s.length));
}
function clsOut(text){
  const r=classify(text);
  if(!text.trim()) return '<p class="note">輸入一段標題或內文即可測試。</p>';
  if(!r.length) return '<p class="note">沒有命中任何關鍵字，此資料將交由語意分析判斷或保留為未分類。</p>';
  return r.map(x=>`<div class="cls-row ${x.p.length?'':'cand'}"><span class="res">${x.p.length?'✓ ':'？'}${x.c.name}</span>
    ${x.p.map(k=>`<span class="kwi p">${esc(k)}</span>`).join('')}${x.s.map(k=>`<span class="kwi">${esc(k)}</span>`).join('')}
    ${x.p.length?'':'<span class="note">僅命中次要關鍵字，不直接判定，需搭配內容確認</span>'}</div>`).join('');
}

          <td class="num">${f2(s.cred.score)} ${kindTag(s.cred.kind)}</td><td class="num">${f2(s.sig.score)} ${kindTag(s.sig.kind)}</td><td class="num">${s.complete}%</td><td>${pill(s.status)}</td></tr>`).join('')}</tbody>

    </section>

/* ===================== 路由 ===================== */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current', (t.dataset.view===state.view||(state.view==='detail'&&t.dataset.view==='dash'))?'page':'false'));
  ({dash:renderDash, detail:renderDetail, data:renderData, method:renderMethod})[state.view]();
}
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){go('detail',o.dataset.open);return}
  const v=e.target.closest('[data-view],[data-view-go]'); if(v){go(v.dataset.view||v.dataset.viewGo)}
});
// 跨過手機／桌面寬度時重繪，讓矩陣圖改用對應尺寸
let lastNarrow=window.innerWidth<600;
window.addEventListener('resize',()=>{const n=window.innerWidth<600;if(n!==lastNarrow){lastNarrow=n;if(state.view==='dash')render()}});
boot();
</script>
