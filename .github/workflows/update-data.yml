name: 更新市場資料

on:
  schedule:
    - cron: "0 22 * * *"   # 每天台灣時間 06:00
  workflow_dispatch:         # 也可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r pipeline/requirements.txt

      - name: 抓取資料並分析
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/update.py

      - name: 提交更新的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變化"
            exit 0
          fi
          git commit -m "更新市場資料 $(TZ=Asia/Taipei date +%F)"
          # 執行期間若有人推送新的 commit，先接上最新版本再推送；
          # 資料檔衝突時保留本次產生的版本（rebase 時 -X theirs 指正在重放的這個 commit）
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "第 ${attempt} 次推送失敗，稍後重試"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
